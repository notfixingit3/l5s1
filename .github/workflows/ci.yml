name: CI

# Runs on dev pushes and PRs (fast feedback), and re-runs as the gate when
# cutting a beta tag. Container builds stay tag-only (see container.yml).
on:
  push:
    branches:
      - dev
    tags:
      - "v*-beta.*"
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned security tooling (module versions)
  GOVULNCHECK_VERSION: v1.10.0
  GOSEC_VERSION: v2.30.0

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pin patched 1.27.x (1.25 is end-of-life; no more stdlib fixes)
          go-version: "1.27.4"
          cache-dependency-path: backend/go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }} ./...
      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ESLint (security)
        run: |
          npm ci
          npx eslint js/ --max-warnings 0
